name: Phase S community interface and API checks
on:
  push:
    branches: [phase-s-community-feed]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate Worker types and bundle
        run: npm run build -w @campusgigs/api
      - name: Typecheck API
        run: npm run check -w @campusgigs/api
      - name: API regression tests
        run: npm test -w @campusgigs/api
      - name: Typecheck web
        run: npm run check -w @campusgigs/web
      - name: Build web
        run: npm run build -w @campusgigs/web
      - name: Typecheck admin
        run: npm run check -w @campusgigs/admin
      - name: Build admin
        run: npm run build -w @campusgigs/admin
      - name: Preserve release Worker bundle for audited deployment
        run: |
          mkdir -p release
          cp apps/api/.cloudflare/output/v0/workers/default/bundle/index.js release/phase-s-worker.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f release/phase-s-worker.js
          if ! git diff --cached --quiet; then
            git commit -m 'build(phase-s): verified Worker bundle [skip ci]'
            git push origin HEAD:phase-s-community-feed
          fi
