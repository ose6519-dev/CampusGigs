name: Phase Q chat validation
on:
  push:
    branches: [phase-q-chat-experience]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck web app
        run: npm run check -w @campusgigs/web
      - name: Build web app
        run: npm run build -w @campusgigs/web
